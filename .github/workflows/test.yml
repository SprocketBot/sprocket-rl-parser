name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test protobuf generation
        run: python -m unittest utils.tests.test_create_proto

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build wheel
        run: |
          python -m pip install 'maturin>=1.11,<2'
          maturin build --release --locked --out "$RUNNER_TEMP/wheels"

      - name: Smoke test installed wheel with minimum protobuf runtime
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install \
            "$RUNNER_TEMP"/wheels/*.whl 'protobuf==5.29.5'
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -I - <<'PY'
          import importlib
          from pathlib import Path
          import sys

          import carball
          import google.protobuf

          assert google.protobuf.__version__ == "5.29.5"
          package_dir = Path(carball.__file__).resolve().parent
          assert package_dir.is_relative_to(Path(sys.prefix).resolve()), package_dir
          generated_modules = sorted((package_dir / "generated").rglob("*_pb2.py"))
          assert generated_modules, "No generated protobuf modules in the wheel"
          for module_path in generated_modules:
              module_name = ".".join(module_path.relative_to(package_dir.parent).with_suffix("").parts)
              importlib.import_module(module_name)

          from carball.generated.api import game_pb2

          game = game_pb2.Game(version=1)
          restored = game_pb2.Game.FromString(game.SerializeToString())
          assert restored == game
          print(f"Imported {len(generated_modules)} protobuf modules and round-tripped Game")
          PY
